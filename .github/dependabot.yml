# 依存の更新を Dependabot に見張らせる
#
# **他人のトークンを預かる以上、依存の脆弱性は自分の問題になる**（NF-43）。
# 手で `npm audit` を回す運用（ロードマップ8章）は忘れるので、機械に任せる。
#
# 画面から作った雛形は `package-ecosystem: ""` のままで、そのままでは動かない。
# ここで実際の生態系を指定している。
version: 2
updates:
  # --- npm --------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 1件ずつ Pull Request が立つと、レビューより通知の方が多くなる。
    # 開発用の依存はまとめて1本にする
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    # **通らない Pull Request を作らせない。** 毎週同じものが立ち直すと、
    # 積み上がった赤を見慣れてしまい、門そのものが無視されるようになる。
    ignore:
      # **`mind-elixir` は 5.15.1 に固定する**（CLAUDE.md）。
      # npm の `latest` タグが prerelease（6.0.0-next）を指しているため、
      # Dependabot の提案に乗ると prerelease へ上がる。
      # 6.0 の安定版が出たら、この行を外して計画的に移行する
      - dependency-name: mind-elixir

      # **TypeScript のメジャーは自動で上げない**（2026-09-05、PR #1 で判明）。
      # `typescript-eslint@8.69.0` の peer が `>=4.8.4 <6.1.0` であり、
      # TypeScript 7 を入れると `npm ci` が解決できずに落ちる。
      # 5.x の中の更新は通す。メジャーは `typescript-eslint` が追随してから、
      # 計画的に上げる作業にする
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # **`@types/node` は 20 系に留める**（同上）。
      # `package.json` の `engines` が `>=20.19.0` なので、
      # 新しいメジャーを入れると**実行環境に無い API が型として通ってしまう。**
      # 型検査が本番より甘くなる方向の食い違いであり、気づきにくい
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # --- GitHub Actions ---------------------------------------------------
  # ワークフローが使う action も供給経路である。
  # **`actions/checkout` などが古いまま放置されるのを防ぐ**
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
