# Pull Request の検査
#
# **これが無いと、検査は main へ入った後にしか走らない。**
# `deploy.yml` は main への push を契機に lint とテストを通すが、
# そこで落ちたときには既に main が壊れている。
#
# **`pull_request` を使い、`pull_request_target` は使わない。**
# 前者はフォーク元のコードを読み取り専用の権限で動かし、シークレットを渡さない。
# 後者は main 側の設定でフォークのコードを動かすため、
# 他人の Pull Request が書き込み権限を得る経路になる。
#
# **リポジトリ側で1度だけ必要な設定:**
#   Settings → Rules → Rulesets で main を保護し、
#   このワークフローの `verify` を必須の検査に指定する。
#   ワークフローを置くだけでは、落ちても merge を止められない。
name: ci

on:
  pull_request:
    branches: [main]
  # 手で流せるようにしておく。設定を直した直後に確認したいことがある
  workflow_dispatch:

# 同じ Pull Request で押し直したら、古い方は打ち切る。
# 配信（`deploy.yml`）と違い、途中で止めても失うものが無い
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 読むだけでよい。**足すときは、本当に要るかを先に問うこと**
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # **DCO の検査に、この Pull Request のコミットが全部要る。**
          # 既定の浅い取得だと base..head が辿れない
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # 依存を入れる前に置く。**署名の不足は 5 秒で分かる**ので、
      # そのために `npm ci` の完了を待たせない
      - name: Signed-off-by の確認
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs "$BASE" "$HEAD"

      - run: npm ci

      # 型 → 整形 → lint → テスト → ビルドの順に並べる。
      # **速く落ちるものを先に置く。** 30 秒で分かる誤りのために
      # テストの完走を待たせない
      - name: 型検査
        run: npm run typecheck

      - name: 整形
        run: npm run format:check

      # `npm run lint` は ESLint に加えて scripts/check-docs.mjs を通す。
      # 壊れた相対リンクと、ロードマップ以外での Phase の完了宣言を弾く
      - name: Lint とドキュメントの検査
        run: npm run lint

      # **カバレッジごと走らせる**（2026-09-05 に門にした）。
      # 同じテストを2回走らせないため `npm test` ではなくこちらを使う。
      #
      # 門にした理由は、同日これが実際に効いたためである。`note.ts` を
      # テスト無しで足したとき、文・行・関数はどれも動かなかったが
      # （97.7% → 97.9%）、**変換層の分岐だけが 92.3% → 88.5% と落ちた。**
      # NF-50（変換層 90% 以上）の破れを捉えたのはこの指標だけだった。
      #
      # 閾値の内訳と、分岐だけ数字が違う理由は `vite.config.ts` にある
      - name: テストとカバレッジ
        run: npm run test:coverage

      # 配信と同じ条件でビルドが通ることまで見る。
      # 型検査を通ってもバンドルで落ちることがある
      - name: ビルド
        env:
          BASE_PATH: /mieru/
        run: npm run build
